<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Diplômés HEI</title>
</head>
<body>
<h1>Promotions</h1>

<table border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Référence</th>
        <th>Année d'entrée</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="promotion : ${promotions}">
        <td th:text="${promotion.ref}">2023</td>
        <td th:text="${promotion.entryYear}">2023</td>
        <td>
            <a th:href="@{/api/promotions/{id}/graduates/export(id=${promotion.id}, path='EL')}">
                Diplômés EL
            </a>
            &nbsp;
            <a th:href="@{/api/promotions/{id}/graduates/export(id=${promotion.id}, path='TN')}">
                Diplômés TN
            </a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
